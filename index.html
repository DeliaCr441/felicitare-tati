<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mulți ani, tati!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --noapte:#101a33;
  --noapte2:#1c2c55;
  --flacara:#ffb347;
  --auriu:#fcbf49;
  --coral:#ef476f;
  --hartie:#fbf9f2;
  --text:#fbf9f2;
}
*{box-sizing:border-box;margin:0}
body{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  background:var(--noapte);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6;
}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--auriu);outline-offset:4px}
.ascuns{display:none!important}

/* ---------- Intro: tortul și lumânarea ---------- */
#intro{
  min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem 1rem;position:relative;overflow:hidden;
  background:
    radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 12%,#fff,transparent),
    radial-gradient(2px 2px at 40% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 45%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 22% 62%,#fff,transparent),radial-gradient(2px 2px at 65% 70%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 8% 85%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 8%,#fff,transparent),
    radial-gradient(ellipse at 50% 60%,var(--noapte2),var(--noapte) 70%);
  transition:opacity .9s;
}
#intro.iese{opacity:0;pointer-events:none}
#intro h1{font-size:clamp(1.9rem,6vw,3.2rem);font-weight:500;line-height:1.2}
#intro .sub{font-family:"Caveat",cursive;font-size:clamp(1.5rem,4.5vw,2.1rem);color:var(--flacara);margin:.6rem 0 1.5rem}
.ps{
  font-family:"Caveat",cursive;font-size:clamp(1.5rem,4.5vw,2rem);color:var(--auriu);margin-top:1.2rem;
  transform:rotate(-2deg);animation:sopteste 2.4s ease-in-out infinite alternate;transition:opacity .4s;
}
@keyframes sopteste{from{opacity:.55}to{opacity:1}}
.ps.dispare{opacity:0;animation:none}
#candela{background:none;position:relative;width:min(300px,76vw);display:block;margin:0 auto;padding:0}
#candela svg{width:100%;height:auto;display:block;overflow:visible}
.halou{
  position:absolute;left:50%;top:-10%;width:340px;height:340px;margin-left:-170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,179,71,.38),transparent 65%);animation:respira 3s ease-in-out infinite;
  transition:opacity .7s;pointer-events:none;
}
@keyframes respira{50%{transform:scale(1.12);opacity:.8}}
.flacara{
  position:absolute;left:50%;top:7.5%;width:20px;height:38px;margin-left:-10px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 75%,#fff6c9 10%,var(--flacara) 55%,#ff6b35);
  box-shadow:0 0 22px 8px rgba(255,179,71,.7);transform-origin:50% 100%;animation:pâlpâie .18s infinite alternate;
  transition:opacity .25s,transform .25s;
}
@keyframes pâlpâie{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
#candela.stinsa .flacara{opacity:0;transform:scale(.2)}
#candela.stinsa .halou{opacity:0}
.fum{position:absolute;left:50%;top:6%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(255,255,255,.45);filter:blur(5px);opacity:0}
#candela.stinsa .fum{animation:fum 1.6s ease-out forwards}
#candela.stinsa .fum:nth-of-type(2){animation-delay:.15s;margin-left:3px}
@keyframes fum{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(5)}}

/* ---------- Luminițe ---------- */
#lumini{position:fixed;top:0;left:0;right:0;height:46px;display:flex;justify-content:space-around;z-index:5;pointer-events:none;border-top:2px solid rgba(255,255,255,.2)}
#lumini span{
  width:12px;height:18px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;margin-top:2px;background:#443;opacity:.5;position:relative;
}
#lumini span.aprins{background:var(--c);box-shadow:0 0 14px 5px var(--c);opacity:1;animation:sclipeste 2.4s ease-in-out infinite alternate}
@keyframes sclipeste{from{filter:brightness(1)}to{filter:brightness(.6)}}

/* ---------- Felicitarea ---------- */
#felicitare{padding:clamp(4.5rem,12vh,7rem) 1.25rem 2rem;text-align:center;animation:apare 1.4s both}
@keyframes apare{from{opacity:0}}
#felicitare h2{
  font-size:clamp(2.7rem,10.5vw,6.5rem);font-weight:800;line-height:1;letter-spacing:-.03em;
  background:linear-gradient(90deg,var(--auriu),#ff8fa3,var(--auriu));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:stralucire 5s linear infinite;
}
@keyframes stralucire{to{background-position:200% 0}}
.scrisoare{
  max-width:36rem;margin:2.2rem auto 0;padding:2.2rem 1.9rem;background:var(--hartie);color:#2a2433;text-align:left;
  border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.45);position:relative;transform:rotate(-1deg);
  font-family:"Caveat",cursive;font-size:clamp(1.45rem,4.4vw,1.85rem);line-height:1.42;
  background-image:repeating-linear-gradient(transparent,transparent 38px,rgba(110,130,190,.13) 39px);
}
.scrisoare p{margin-bottom:1rem;opacity:0;transform:translateY(8px);transition:opacity 1.2s,transform 1.2s}
.scrisoare p.vizibil{opacity:1;transform:none}
.scrisoare .semn{text-align:right;color:var(--coral);font-weight:700;margin:1.2rem 0 0;font-size:1.15em}

.comenzi{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin:3rem 0 .8rem;opacity:0;pointer-events:none;transition:opacity 1s}
.comenzi.gata{opacity:1;pointer-events:auto}
.btn{padding:.95rem 1.7rem;border-radius:99px;font-weight:800;font-size:1.05rem;background:var(--flacara);color:var(--noapte);transition:transform .15s}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.96)}
.btn.sec{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.btn[disabled]{opacity:.35;pointer-events:none}
#contor{font-family:"Caveat",cursive;font-size:1.5rem;color:var(--flacara);min-height:2rem}

/* ---------- Pozele atârnate ---------- */
#perete{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:3.6rem 1.6rem;
  max-width:1100px;margin:1rem auto;padding:3rem 1.25rem 2rem;
}
.polaroid{
  position:relative;background:var(--hartie);padding:12px 12px 34px;border-radius:2px;
  box-shadow:0 12px 26px rgba(0,0,0,.45);cursor:zoom-in;transform-origin:50% -34px;
  animation:cade 1s cubic-bezier(.2,1.3,.4,1) both,leagana 5.5s ease-in-out 1s infinite alternate;
  transition:scale .25s;
}
.polaroid::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:34px;margin-left:-1px;background:rgba(255,255,255,.55)}
.polaroid::after{content:"♥";position:absolute;left:0;right:0;bottom:7px;text-align:center;color:var(--coral);font-size:1.15rem;line-height:1}
.polaroid:hover{scale:1.07;z-index:2;animation-play-state:paused}
@keyframes cade{from{opacity:0;transform:translateY(-160px) rotate(calc(var(--rot) * 5))}}
@keyframes leagana{from{transform:rotate(calc(var(--rot) - 2.2deg))}to{transform:rotate(calc(var(--rot) + 2.2deg))}}
.cadru{aspect-ratio:1;background:#ddd;overflow:hidden}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block}
.lipsa{height:100%;display:grid;place-items:center;padding:1rem;text-align:center;font-size:.9rem;color:var(--noapte);background:linear-gradient(135deg,var(--auriu),#ff8fa3)}

/* ---------- De ce te iubim ---------- */
#final{text-align:center;padding:3rem 1.25rem 6rem}
#motive{list-style:none;padding:0;max-width:30rem;margin:0 auto 2.2rem;font-family:"Caveat",cursive;font-size:clamp(1.55rem,5vw,2.1rem);line-height:1.3}
#motive li{margin-bottom:1.1rem;opacity:0;transform:translateY(10px);transition:opacity 1.3s,transform 1.3s}
#motive li.vizibil{opacity:1;transform:none}
#motive li::before{content:"♥ ";color:var(--coral)}
#finalText{font-size:clamp(2rem,8vw,4rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--auriu);opacity:0;transition:opacity 1.6s;margin-bottom:2rem}
#finalText.vizibil{opacity:1}

/* ---------- Poză mărită ---------- */
dialog{border:0;background:transparent;max-width:min(92vw,720px);width:100%;padding:0;overflow:visible}
dialog::backdrop{background:rgba(8,12,26,.9)}
dialog img{width:100%;max-height:82vh;object-fit:contain;border-radius:4px;display:block}
dialog .inchide{position:absolute;top:-2.8rem;right:0;background:var(--auriu);color:var(--noapte);border-radius:99px;padding:.35rem 1.1rem;font-weight:800}

canvas{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<canvas id="confetti" aria-hidden="true"></canvas>
<div id="lumini" class="ascuns" aria-hidden="true"></div>

<!-- 1. Tortul -->
<section id="intro">
  <div>
    <h1>Pune o dorință, tati.</h1>
    <p class="sub">Apoi suflă în lumânare.</p>
    <button id="candela" aria-label="Suflă în lumânare">
      <span class="halou"></span>
      <svg viewBox="0 0 300 260" aria-hidden="true">
        <rect x="143" y="30" width="14" height="62" rx="3" fill="#fbf9f2"/>
        <path d="M143 48 l14 8 M143 66 l14 8" stroke="#ef476f" stroke-width="4"/>
        <rect x="60" y="92" width="180" height="62" rx="12" fill="#ef476f"/>
        <path d="M60 106 q15 22 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 v-6 h-180z" fill="#fbf9f2"/>
        <rect x="30" y="154" width="240" height="70" rx="14" fill="#fcbf49"/>
        <path d="M30 170 q20 26 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 v-8 h-240z" fill="#fbf9f2"/>
        <circle cx="90" cy="205" r="5" fill="#ef476f"/><circle cx="150" cy="208" r="5" fill="#ef476f"/><circle cx="210" cy="205" r="5" fill="#ef476f"/>
        <ellipse cx="150" cy="232" rx="135" ry="12" fill="#1c2c55"/>
      </svg>
      <span class="flacara"></span><span class="fum"></span><span class="fum"></span>
    </button>
    <p class="ps" id="ps">PS: apasă pe foc</p>
  </div>
</section>

<!-- 2. Felicitarea -->
<main id="felicitare" class="ascuns">
  <h2 id="titlu"></h2>
  <div class="scrisoare" id="scrisoare"></div>

  <div class="comenzi" id="comenzi">
    <button class="btn" id="mai">Deschide cutia cu amintiri</button>
    <button class="btn sec" id="toate">Arată-le pe toate</button>
  </div>
  <div id="contor" aria-live="polite"></div>

  <div id="perete"></div>

  <div id="final" class="ascuns">
    <ul id="motive"></ul>
    <p id="finalText"></p>
    <button class="btn sec" id="inapoi">Mai vreau o dată</button>
  </div>
</main>

<dialog id="mare">
  <button class="inchide" id="inchide">Închide</button>
  <img id="mareImg" alt="Amintire">
</dialog>

<script>
/* =====================================================
   ✏️ AICI SCHIMBI TEXTELE ȘI POZELE
   ===================================================== */
const CONFIG = {
  titlu: "La mulți ani, tati!",
  mesaj: [
    "Dragă tati,",
    "Când eram mici, brațele tale erau cel mai sigur loc din lume. Acum, că suntem mari, tot acolo ne întoarcem cu gândul când avem nevoie de curajul și iubirea ta.",
    "Ne-ai învățat să mergem, să cădem și să ne ridicăm la loc. Ne-ai învățat că iubirea nu se spune mereu în cuvinte, ci în lucruri mici: un drum făcut pentru noi, o grijă ascunsă, un „sunt aici”.",
    "Poate nu ți-am spus destul de des, așa că o spunem acum, cu voce tare: mulțumim, tati.",
    "Fie ca tot binele și toată iubirea pe care ni l-ai dat să se întoarcă la tine înmiit. La mulți ani!",
  ],
  semnatura: "Cu toată dragostea, Andrei, Filip și Delia-Cristina",
  motive: [
    "Pentru că ești mereu lângă noi.",
    "Pentru că te gândești mereu la noi.",
    "Pentru că ne suporți și când suntem enervanți.",
    "Pentru că avem cu cine să râdem de toate prostiile.",
    "Pentru că ești tatăl nostru.",
  ],
  final: "La mulți ani, tati. Te iubim!",
};

/* Pune pozele în folderul „poze” lângă index.html și trece numele lor aici. */
const POZE = ["poze/1.jpg","poze/2.jpg","poze/3.jpg","poze/4.jpg","poze/5.jpg","poze/6.jpg","poze/7.jpg","poze/8.jpg"];
/* ===================================================== */

const $ = id => document.getElementById(id);
const culori = ["#ef476f","#fcbf49","#06d6a0","#4cc9f0","#ff9ecd"];
let afisate = 0;

/* ---- Texte ---- */
$("titlu").textContent = CONFIG.titlu;
CONFIG.mesaj.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("scrisoare").appendChild(p); });
const semn = document.createElement("p"); semn.className = "semn"; semn.textContent = CONFIG.semnatura; $("scrisoare").appendChild(semn);
CONFIG.motive.forEach(t => { const li = document.createElement("li"); li.textContent = t; $("motive").appendChild(li); });
$("finalText").textContent = CONFIG.final;

/* ---- Luminițe ---- */
const lumini = $("lumini");
const nrLumini = Math.max(8, Math.round(innerWidth / 70));
for (let i = 0; i < nrLumini; i++) {
  const s = document.createElement("span");
  s.style.setProperty("--c", ["#ffd166","#ef476f","#06d6a0","#4cc9f0"][i % 4]);
  s.style.animationDelay = (-Math.random() * 2) + "s";
  lumini.appendChild(s);
}

/* ---- Confetti și inimioare ---- */
const cv = $("confetti"), cx = cv.getContext("2d");
let bucati = [], rulare = false;
function dim(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", dim); dim();
function confetti(n){
  for (let i = 0; i < n; i++) bucati.push({
    x: innerWidth / 2, y: innerHeight * .55, vx: (Math.random() - .5) * 18, vy: -Math.random() * 17 - 4,
    s: 5 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: culori[Math.floor(Math.random() * culori.length)], g: .4, a: 1, inima: false
  });
  porneste();
}
function inimioare(n){
  for (let i = 0; i < n; i++) setTimeout(() => {
    bucati.push({ x: Math.random() * innerWidth, y: innerHeight + 20, vx: (Math.random() - .5) * 1.2, vy: -(1.5 + Math.random() * 2.5),
      s: 16 + Math.random() * 22, r: 0, vr: 0, c: Math.random() > .5 ? "#ef476f" : "#ff9ecd", g: 0, a: .9, inima: true });
    porneste();
  }, i * 140);
}
function porneste(){ if (!rulare) { rulare = true; requestAnimationFrame(anim); } }
function anim(){
  cx.clearRect(0, 0, cv.width, cv.height);
  bucati = bucati.filter(p => p.y > -50 && p.y < cv.height + 30);
  bucati.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.globalAlpha = p.a; cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if (p.inima) { cx.font = p.s + "px sans-serif"; cx.textAlign = "center"; cx.fillText("♥", 0, 0); }
    else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    cx.restore();
  });
  if (bucati.length) requestAnimationFrame(anim); else { rulare = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* ---- Suflă în lumânare ---- */
$("candela").addEventListener("click", () => {
  const c = $("candela");
  if (c.classList.contains("stinsa")) return;
  c.classList.add("stinsa");
  $("ps").classList.add("dispare");
  setTimeout(() => $("intro").classList.add("iese"), 1400);
  setTimeout(() => {
    $("intro").classList.add("ascuns");
    $("felicitare").classList.remove("ascuns");
    lumini.classList.remove("ascuns");
    scrollTo(0, 0);
    aprindeLumini();
  }, 2300);
});

function aprindeLumini(){
  const l = [...lumini.children];
  l.forEach((s, i) => setTimeout(() => s.classList.add("aprins"), 500 + i * 140));
  setTimeout(() => { confetti(200); inimioare(14); scrie(); }, 500 + l.length * 140 + 200);
}

function scrie(){
  const ps = [...document.querySelectorAll(".scrisoare p")];
  ps.forEach((p, i) => setTimeout(() => p.classList.add("vizibil"), i * 2200));
  setTimeout(() => $("comenzi").classList.add("gata"), ps.length * 2200 + 300);
}

/* ---- Pozele ---- */
function adaugaPoza(){
  if (afisate >= POZE.length) return;
  const src = POZE[afisate++];
  const f = document.createElement("figure");
  f.className = "polaroid"; f.tabIndex = 0;
  f.style.setProperty("--rot", (Math.random() * 6 - 3).toFixed(1) + "deg");
  f.innerHTML = '<div class="cadru"><img alt="Amintire" loading="lazy"></div>';
  const img = f.querySelector("img");
  img.src = src;
  img.onerror = () => img.replaceWith(Object.assign(document.createElement("div"), { className: "lipsa", textContent: "Pune poza în " + src }));
  const deschide = () => { const i = f.querySelector("img"); if (i) { $("mareImg").src = i.src; $("mare").showModal(); } };
  f.addEventListener("click", deschide);
  f.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); deschide(); } });
  $("perete").appendChild(f);
}

function actualizeaza(){
  const gata = afisate >= POZE.length;
  $("mai").textContent = "Încă o amintire";
  $("contor").textContent = gata ? "" : afisate + " din " + POZE.length;
  if (gata) { $("mai").disabled = true; $("toate").disabled = true; setTimeout(final, 1400); }
}

function final(){
  $("final").classList.remove("ascuns");
  $("final").scrollIntoView({ behavior: "smooth", block: "start" });
  const li = [...document.querySelectorAll("#motive li")];
  li.forEach((x, i) => setTimeout(() => x.classList.add("vizibil"), 700 + i * 1800));
  setTimeout(() => { $("finalText").classList.add("vizibil"); confetti(240); inimioare(40); }, 700 + li.length * 1800 + 400);
}

$("mai").addEventListener("click", () => {
  adaugaPoza(); actualizeaza();
  if (afisate === 1) inimioare(8);
  const ultima = $("perete").lastElementChild;
  if (ultima && afisate < POZE.length) setTimeout(() => ultima.scrollIntoView({ behavior: "smooth", block: "center" }), 200);
});
$("toate").addEventListener("click", () => {
  const ramase = POZE.length - afisate;
  for (let i = 0; i < ramase; i++) setTimeout(() => { adaugaPoza(); if (i === ramase - 1) actualizeaza(); }, i * 300);
});
$("inapoi").addEventListener("click", () => {
  $("perete").innerHTML = ""; afisate = 0;
  $("final").classList.add("ascuns");
  document.querySelectorAll("#motive li, #finalText").forEach(x => x.classList.remove("vizibil"));
  $("mai").disabled = false; $("toate").disabled = false; $("mai").textContent = "Deschide cutia cu amintiri"; $("contor").textContent = "";
  scrollTo({ top: 0, behavior: "smooth" }); inimioare(20);
});

$("inchide").addEventListener("click", () => $("mare").close());
$("mare").addEventListener("click", e => { if (e.target === $("mare")) $("mare").close(); });
</script>
</body>
</html>
